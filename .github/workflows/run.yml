# 定时抓取免费节点订阅并提交产物
# 使用内置 GITHUB_TOKEN 推送，不会再次触发 push 事件
name: Update Free Node Subscription

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'   # 每小时整点（UTC），GitHub 定时任务可能有几分钟延迟
  workflow_dispatch:       # 支持在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: update-subscribe
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download the subscribe
        run: bash ./run.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "订阅内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 自动更新订阅 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin main
